<style>
/*
VOICE: sideline clipboard — direct, legible under sun, built for one thumb.
IDEA: the coach's practice card + stadium scoreboard; blocks are the card's rows, clocks are scoreboard digits.
PICTURE: the live session itself — header scoreboard clock, accordion blocks with exercise list beside the video panel.
COLOUR and TYPE: Wildcats red #c8102e, black, white; Barlow Condensed for digits/titles, Barlow for text.
LAYOUT: fixed scoreboard header, scrolling content, fixed 4-tab bar; sheets slide up for editing.

let actx=null;
function beep(n=1,f=880){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:200)}catch(e){}}
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){wake.release();wake=null}}catch(e){}}

function vEntreno(){
  const s=curSession();
  if(!s)return `<div class="card empty"><h2>Sin sesión planificada</h2><p>Crea tu primera sesión con la estructura de 2 horas: estiramiento, calentamiento, drills, jugadas y enfriamiento.</p><button class="btn p" data-act="sess-new">Planificar sesión</button></div>`;
  const opts=sortSess().map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(fDate(x.date))} · ${esc(x.title||'Sesión')}</option>`).join('');
  const cur=run.sid===s.id&&run.blk?run.blk.bid:null;
  const blocks=(s.blocks||[]).map((b,bi)=>{
    const open=ui.open[b.id]??(bi===0);
    const items=(b.items||[]).map(id=>exById(id)).filter(Boolean);
    const selId=ui.sel[b.id]&&items.find(e=>e.id===ui.sel[b.id])?ui.sel[b.id]:(items[0]&&items[0].id);
    const sel=items.find(e=>e.id===selId);
    const done=s.done||{};
    const isCur=cur===b.id;
    return `<details class="card blk ${isCur?'cur':''}" data-bid="${b.id}" ${open?'open':''}>
      <summary><div><div class="nm">${esc(b.name)}</div><div class="meta">${+b.min||0} min · ${items.length} ejercicio${items.length===1?'':'s'}</div></div>${isCur?'<span class="pill">En curso</span>':''}${ICON.chev}</summary>
      <div class="blkbar">${isCur?`<span class="btimer" data-t="blk">--:--</span><span class="sp"></span><button class="btn" data-act="blk-pause" data-bid="${b.id}">${run.blk.on?'Pausar':'Seguir'}</button><button class="btn p" data-act="blk-next" data-bid="${b.id}">Siguiente bloque</button>`:`<button class="btn" data-act="blk-start" data-bid="${b.id}">${ICON.play} Iniciar bloque · ${+b.min||0}:00</button>`}</div>
      ${items.length?`<div class="split"><div class="exl">${items.map(e=>`<button class="ex ${done[b.id+'|'+e.id]?'done':''}" aria-pressed="${e.id===selId}" data-act="ex-sel" data-bid="${b.id}" data-eid="${e.id}"><b>${esc(e.name)}</b><i>${esc([e.dose,e.min?e.min+' min':''].filter(Boolean).join(' · ')||e.cat)}</i></button>`).join('')}</div>${vidPanel(sel)}</div>
      ${sel?`<div class="exinfo"><div class="card"><div class="row"><b>${esc(sel.name)}</b><span class="sp"></span><button class="btn ${done[b.id+'|'+sel.id]?'p':''}" data-act="ex-done" data-bid="${b.id}" data-eid="${sel.id}">${done[b.id+'|'+sel.id]?'Hecho ✓':'Marcar hecho'}</button></div>${sel.notes?`<p class="small">${esc(sel.notes)}</p>`:'<p class="small muted">Sin puntos clave. Agrégalos en Más › Biblioteca.</p>'}</div></div>`:''}`
      :`<p class="muted small" style="padding:0 14px 14px">Sin ejercicios. <button class="back" data-act="sess-edit" data-sid="${s.id}">Agregar en el plan</button></p>`}
    </details>`}).join('');
  return `<div class="row" style="margin-bottom:10px;flex-wrap:nowrap"><select data-act="sid" aria-label="Sesión" style="flex:1">${opts}</select><button class="btn icon" data-act="sess-edit" data-sid="${s.id}" aria-label="Editar sesión"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button></div>
  <p class="small muted" style="margin:0 0 10px">${esc(s.rama||'Mixto')} · ${sessMin(s)} min planificados${s.notes?' · '+esc(s.notes):''}</p>${blocks||'<div class="card empty"><p>Esta sesión no tiene bloques.</p></div>'}`;
}
function vidPanel(e){
  if(!e)return '<div class="vid"><div class="ph muted">Selecciona un ejercicio</div></div>';
  if(e.clip)return `<div class="vid"><video data-clip="${esc(e.clip)}" controls playsinline loop preload="metadata"></video></div>`;
  const p=plat(e.url),u=safeUrl(e.url);
  const yt=ytId(u);if(yt&&navigator.onLine)return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?playsinline=1&rel=0" title="${esc(e.name)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="border:0;width:100%;height:100%"></iframe></div>`;
  if(!p||!u)return `<div class="vid"><div class="ph"><div class="play">${ICON.play}</div><div class="ttl">${esc(e.name)}</div><span class="small" style="color:#aaa">Sin video. Pega el enlace o guarda el clip.</span><button class="btn" style="background:#222;border-color:#333;color:#fff" data-act="ex-edit" data-eid="${e.id}">Agregar video</button></div></div>`;
  return `<div class="vid"><div class="ph"><span class="plt ${p[0]}">${p[1]}</span><div class="ttl">${esc(e.name)}</div><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${ICON.play} Ver video</a><span class="small" style="color:#aaa">Se abre en la app de ${p[1]}${navigator.onLine?'':' · sin conexión'}</span></div></div>`;
}

function vTiempos(){
  const seg=`<div class="seg" role="group">${[['sesion','Sesión'],['partido','Partido'],['intervalos','Intervalos']].map(([k,l])=>`<button aria-pressed="${ui.tm===k}" data-act="tm" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(ui.tm==='partido')return seg+vPartido();
  if(ui.tm==='intervalos')return seg+vIntervalos();
  const s=curSession();
  if(!s)return seg+`<div class="card empty"><p>Planifica una sesión para ver su cronograma.</p><button class="btn p" data-act="sess-new">Planificar sesión</button></div>`;
  const el=run.sid===s.id?sessEl():0;let acc=0;
  const items=(s.blocks||[]).map(b=>{const st=acc;acc+=(+b.min||0);const cur=run.sid===s.id&&run.blk&&run.blk.bid===b.id;const past=el/60000>=acc&&!cur;
    return `<div class="it ${cur?'cur':''} ${past?'past':''}"><span class="num">${pad(Math.floor(st/60))}:${pad(st%60)}</span><div><b>${esc(b.name)}</b><div class="small muted">${+b.min||0} min</div></div>${cur?'<span class="pill">Ahora</span>':`<button class="btn" data-act="blk-start" data-bid="${b.id}" aria-label="Iniciar ${esc(b.name)}">${ICON.play}</button>`}</div>`}).join('');
  const blk=run.sid===s.id&&run.blk?(s.blocks||[]).find(b=>b.id===run.blk.bid):null;
  return seg+`<div class="board ${run.on&&run.sid===s.id?'run':''}"><div class="lbl">Tiempo de sesión · plan ${sessMin(s)} min</div><div class="big" data-t="sess">${fmt(el)}</div>
  ${blk?`<div class="lbl" style="margin-top:6px">${esc(blk.name)} · restante</div><div class="big" style="font-size:clamp(40px,12vw,64px)" data-t="blk">--:--</div>`:''}
  <div class="ctrls"><button class="btn" data-act="sess-reset">Reiniciar</button><button class="btn p" data-act="sess-toggle">${run.on&&run.sid===s.id?'Pausar':'Iniciar'}</button><button class="btn" data-act="blk-next" ${blk?'':'disabled'}>Siguiente</button></div></div>
  <div class="sched">${items}</div>`;
}
function vPartido(){
  const left=M.dur-mEl(),h=M.half,to=M.to[h-1]||[0,0];
  const team=i=>`<div class="team"><input value="${esc(M.names[i])}" data-act="mname" data-i="${i}" aria-label="Nombre equipo"><div class="big num">${M.sc[i]}</div><div class="row"><button class="btn icon" data-act="sc" data-i="${i}" data-v="-1">−1</button><button class="btn icon" data-act="sc" data-i="${i}" data-v="1">+1</button><button class="btn icon" data-act="sc" data-i="${i}" data-v="2">+2</button><button class="btn icon p" data-act="sc" data-i="${i}" data-v="6">+6</button></div>
  <div class="tos" aria-label="Tiempos fuera">${[0,1].map(k=>`<button class="${k<to[i]?'used':''}" data-act="to" data-i="${i}" aria-label="Tiempo fuera ${k+1}"></button>`).join('')}</div><div class="small muted">Tiempos fuera: ${2-to[i]} de 2</div></div>`;
  const sub=M.subt?`<div class="note r row"><b>${esc(M.subt.label)}</b><span class="sp"></span><span class="btimer" data-t="subt">--</span><button class="btn" data-act="subt-stop">Cerrar</button></div>`:'';
  const last2=left<=120000&&left>0;
  return `<div class="board ${M.on?'run':''}"><div class="lbl">${h===1?'Primera':'Segunda'} mitad · 20:00</div><div class="big" data-t="match">${fmtC(left)}</div>
  <div class="ctrls"><button class="btn" data-act="m-half">${h===1?'Ir a 2ª mitad':'Nuevo partido'}</button><button class="btn p" data-act="m-toggle">${M.on?'Parar':'Correr'}</button><button class="btn" data-act="m-adj">Ajustar</button></div></div>
  ${M.rc?`<div class="note r"><b>Reloj corrido.</b> Diferencia ≥30 en el aviso de 2 min: el reloj ya no se detiene el resto del partido (Regla 3, Sec. 2, Art. 5).</div>`:''}
  ${last2&&!M.rc?`<div class="note w"><b>Últimos 2 minutos:</b> para el reloj en first down y cambio de posesión, penalidad, jugador/balón fuera, pase incompleto, anotación y PAT, tiempo fuera.</div>`:''}
  ${sub}
  <div class="sub"><button class="btn" data-act="subt" data-k="play"><b class="num" style="font-size:22px">20s</b><small>Reloj de jugada</small></button><button class="btn" data-act="subt" data-k="qb"><b class="num" style="font-size:22px">7s</b><small>Pase del QB</small></button><button class="btn" data-act="subt" data-k="to"><b class="num" style="font-size:22px">60s</b><small>Tiempo fuera</small></button><button class="btn" data-act="subt" data-k="half"><b class="num" style="font-size:22px">2:00</b><small>Medio tiempo</small></button></div>
  <div class="score">${team(0)}${team(1)}</div>
  <p class="small muted">Regla FFG: 2 tiempos fuera de 60 s por mitad, no se acumulan a la segunda mitad. Tocar un cuadro rojo descuenta un tiempo fuera e inicia la cuenta de 60 s.</p>`;
}
function vIntervalos(){
  const st=intState();
  return `<div class="board ${I.on?'run':''}"><div class="lbl">${st.done?'Terminado':(st.phase==='work'?'TRABAJO':'DESCANSO')+' · ronda '+st.round+' de '+I.rounds}</div><div class="big" data-t="intv">${fmtC(st.left)}</div>
  <div class="ctrls"><button class="btn" data-act="i-reset">Reiniciar</button><button class="btn p" data-act="i-toggle">${I.on?'Pausar':'Iniciar'}</button><button class="btn" data-act="i-preset">30/15×8</button></div></div>
  <div class="card" style="padding:12px;margin-top:12px"><div class="row"><label class="f" style="flex:1"><span>Trabajo (s)</span><input type="number" inputmode="numeric" min="5" value="${I.work}" data-act="iset" data-k="work"></label><label class="f" style="flex:1"><span>Descanso (s)</span><input type="number" inputmode="numeric" min="0" value="${I.rest}" data-act="iset" data-k="rest"></label><label class="f" style="flex:1"><span>Rondas</span><input type="number" inputmode="numeric" min="1" value="${I.rounds}" data-act="iset" data-k="rounds"></label></div><p class="small muted" style="margin:0">Para acondicionamiento y drills por estaciones. Suena y vibra en cada cambio.</p></div>`;
}
function intState(){
  const el=I.acc+(I.on?Date.now()-I.start:0),cyc=(I.work+I.rest)*1000,tot=cyc*I.rounds-I.rest*1000;
  if(el>=tot)return{done:true,left:0,round:I.rounds,phase:'work'};
  const r=Math.floor(el/cyc),inC=el-r*cyc;
  return inC<I.work*1000?{phase:'work',left:I.work*1000-inC,round:r+1}:{phase:'rest',left:cyc-inC,round:r+1};
}

function vAsistencia(){
  const s=curSession();
  if(!roster.length)return `<div class="card empty"><h2>Sin jugadores</h2><p>Agrega a tus jugadores con número, rama y posición para pasar lista.</p><button class="btn p" data-act="pl-new">Agregar jugador</button></div>`;
  if(!s)return `<div class="card empty"><p>Planifica una sesión para pasar lista.</p><button class="btn p" data-act="sess-new">Planificar sesión</button></div>`;
  const att=s.att||{};
  const ramas=['Todos','Masculino','Femenino'];
  const list=roster.filter(p=>ui.attR==='Todos'||p.rama===ui.attR).sort((a,b)=>(+a.num||999)-(+b.num||999));
  const c={P:0,T:0,A:0};list.forEach(p=>{if(att[p.id])c[att[p.id]]++});
  const hist=sessions.filter(x=>x.att&&Object.keys(x.att).length);
  const pct=p=>{const h=hist.filter(x=>x.att[p.id]);if(!h.length)return null;return Math.round(h.filter(x=>x.att[p.id]!=='A').length/h.length*100)};
  const opts=sortSess().map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(fDate(x.date))} · ${esc(x.title||'Sesión')}</option>`).join('');
  return `<select data-act="sid" aria-label="Sesión" style="margin-bottom:10px">${opts}</select>
  <div class="seg" role="group">${ramas.map(r=>`<button aria-pressed="${ui.attR===r}" data-act="attR" data-v="${r}">${r}</button>`).join('')}</div>
  <div class="stats"><div class="stat"><div class="num" style="color:var(--ok)">${c.P}</div><span>Presentes</span></div><div class="stat"><div class="num" style="color:var(--warn)">${c.T}</div><span>Tarde</span></div><div class="stat"><div class="num" style="color:var(--red2)">${c.A}</div><span>Ausentes</span></div><div class="stat"><div class="num">${list.length-c.P-c.T-c.A}</div><span>Sin marcar</span></div></div>
  <div class="row" style="margin-bottom:10px"><button class="btn" data-act="att-all">Todos presentes</button><span class="sp"></span><button class="btn g" data-act="pl-new">+ Jugador</button></div>
  <div class="att">${list.map(p=>{const v=att[p.id],q=pct(p);return `<div class="card pl"><div class="jn">${esc(p.num||'–')}</div><div class="who"><b>${esc(p.name)}</b><span>${esc([p.pos,p.role!=='Jugador'?p.role:''].filter(Boolean).join(' · '))}${q!==null?` · ${q}% asist.`:''}</span></div><div class="tri">${[['P','P'],['T','T'],['A','A']].map(([k,l])=>`<button data-act="att" data-pid="${p.id}" data-v="${k}" aria-pressed="${v===k}" aria-label="${k==='P'?'Presente':k==='T'?'Tarde':'Ausente'}">${l}</button>`).join('')}</div></div>`}).join('')}</div>
  <p class="small muted">P presente · T tarde · A ausente. El % cuenta presentes y tardes sobre las sesiones donde se pasó lista.</p>`;
}

function vRules(){
  return `<h2>Reglas de tiempo FFG</h2><div class="card" style="padding:14px"><ul class="rules" style="padding-left:18px;margin:0">
  <li><b>Duración:</b> 40 min en 2 mitades de 20 min, descanso de 2 min.</li>
  <li><b>Reloj de jugada:</b> 20 s para el snap (FFG lo reduce de 25 a 20).</li>
  <li><b>QB:</b> más de 7 s para lanzar es Delay of pass (pérdida de down).</li>
  <li><b>Tiempos fuera:</b> 2 por equipo por mitad, 60 s cada uno; los de la 1ª mitad no pasan a la 2ª. Pedir uno sin tener: 5 yardas.</li>
  <li><b>El reloj para:</b> fin de la 1ª mitad, tiempo fuera, lesión o a pedido del árbitro.</li>
  <li><b>Últimos 2 min de cada mitad</b> también para en: first down y cambio de posesión, penalidad, jugador o balón fuera, pase incompleto o fumble al suelo, anotación y PAT, tiempo fuera.</li>

  <li><b>Extensión:</b> la mitad no termina si el último down tuvo falta aceptada; no corre reloj en extensión ni tiempo extra.</li>
  <li><b>Tiempo extra:</b> solo postemporada; sin tiempos fuera.</li></ul>

  else if(a==='b-name'){draft.blocks[+el.dataset.bi].name=el.value.trim()||'Bloque'}
  else if(a==='bi-add'){readSessFields();const bi=+el.dataset.bi;
    if(el.value==='__new'){const cat=CATS.find(c=>c.startsWith(draft.blocks[bi].name.split(' ')[0]))||'Drills';const keep=draft;openSheet(exForm({id:'',name:'',cat,url:'',dose:'',min:'',notes:''}),{back:{draft:keep,bi}});return}
    if(el.value){draft.blocks[bi].items.push(el.value)}rerenderSheet()}
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='q'){ui.q=e.target.value;const q=ui.q.toLowerCase();$('#libList').innerHTML=libItems(lib.filter(x=>(!ui.qc||x.cat===ui.qc)&&(!q||(x.name+' '+(x.notes||'')).toLowerCase().includes(q))))}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='ssF'){readSessFields();const i=sessions.findIndex(s=>s.id===draft.id);if(i>=0)sessions[i]=draft;else sessions.push(draft);saveSess();ui.sid=draft.id;saveUI();closeSheet();toast('Sesión guardada');render()}
  else if(f.id==='exF'){
    const ctx=sheetCtx||{};
    const fd=new FormData(f);const isNew=!$('#exF [data-act=ex-del]');
    const eid=isNew?uid():$('#exF [data-act=ex-del]').dataset.eid;
    let ex=exById(eid)||{id:eid};
    Object.assign(ex,{name:fd.get('name').trim(),cat:fd.get('cat'),min:fd.get('min'),dose:fd.get('dose').trim(),url:fd.get('url').trim(),notes:fd.get('notes').trim()});
    const file=f.file&&f.file.files[0];
    if(file){const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Guardando clip…';
      try{const cid='c'+uid();await clipPut(cid,file);if(ex.clip)await clipDel(ex.clip);ex.clip=cid;persist()}catch(err){toast('No hay espacio para el clip');btn.disabled=false;btn.textContent='Guardar';return}}
    if(isNew)lib.push(ex);saveLib();
    if(ctx.back){draft=ctx.back.draft;draft.blocks[ctx.back.bi].items.push(ex.id);openSheet(sessForm())}else{closeSheet()}
    toast('Ejercicio guardado');render()}
  else if(f.id==='plF'){const fd=new FormData(f);const del=$('#plF [data-act=pl-del]');const id=del?del.dataset.pid:uid();let p=roster.find(x=>x.id===id);if(!p){p={id};roster.push(p)}
    Object.assign(p,{name:fd.get('name').trim(),num:fd.get('num').trim(),rama:fd.get('rama'),role:fd.get('role'),pos:fd.get('pos'),pos2:fd.get('pos2')});saveRoster();closeSheet();toast('Jugador guardado');render()}
  else if(f.id==='adjF'){const ms=((parseInt(f.m.value)||0)*60+(parseInt(f.s.value)||0))*1000;M.acc=M.dur-Math.min(M.dur,ms);if(M.on)M.start=Date.now();M.warned[M.half-1]=ms<=120000&&M.warned[M.half-1];saveM();closeSheet();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['entreno','tiempos','asistencia','mas'].includes(h)&&h!==ui.tab){ui.tab=h;render()}});

render();

/* ---------- arranque local ---------- */
(async()=>{
  await idbOpen();
  if(!idb){setSync('Modo limitado · sin almacenamiento');return}
  const [l,r,ss]=await Promise.all([kvGet('lib'),kvGet('roster'),kvGet('sessions')]);
  if(Array.isArray(l))lib=l;else kvPut('lib',lib);
  if(Array.isArray(r))roster=r;else kvPut('roster',roster);
  if(Array.isArray(ss))sessions=ss;else kvPut('sessions',sessions);
  if(!lib.length&&!sessions.length)seed();
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone)persist();
  setSync(standalone?'Guardado en este teléfono':'Instala la app para proteger tus datos');
  if(!sheetOpen())render();
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('online',()=>render());addEventListener('offline',()=>render());

  const B=(name,min,items)=>({id:uid(),name,min,items});
  sessions=[{id:'ejemplo',title:'Ejemplo · Rutas y rush',date:todayISO(),rama:'Mixto',notes:'Sesión de muestra: edítala o duplícala',blocks:[B('Estiramiento',10,['ex01','ex02','ex03']),B('Calentamiento',15,['ex04','ex05','ex06']),B('Drills',45,['ex07','ex08','ex09','ex10']),B('Jugadas / Scrimmage',40,['ex11','ex12']),B('Enfriamiento',10,['ex14'])],att:{},done:{}}];
  saveLib();saveSess();
}
function sheetOpen(){return $('#sheet').classList.contains('on')}
